<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>SoleNexa · Factory workspace</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <section id="splash" aria-label="IQ Links loading">
      <img src="../iq-links-logo.png" alt="IQ Links" />
      <div class="splash-line"></div>
      <p>Software powered by IQ Links</p>
    </section>
    <a class="skip" href="#main">Skip to workspace</a>
    <aside id="sidebar">
      <div class="brand">
        <img
          src="../iq-links-logo.png"
          id="brand-logo"
          alt="IQ Links"
          width="190"
          height="64"
        />
      </div>
      <div class="workspace">
        <span class="workspace-icon">SN</span>
        <div>Factory workspace<small>Production & accounts</small></div>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
      <div class="side-footer">
        <span class="dot"></span> Offline desktop<small
          >Your records stay on this computer.</small
        >
      </div>
    </aside>
    <div class="shell">
      <header>
        <span
          >WORKSPACE <span class="slash">/</span>
          <strong id="crumb">Overview</strong></span
        >
        <div class="header-right"><div id="account-controls" class="actions"></div>
          <span class="badge green">Local database</span><span id="date"></span
          ><span class="avatar">SN</span>
        </div>
      </header>
      <main id="main" tabindex="-1"><p>Opening factory records…</p></main>
      <footer>
        SoleNexa <span>Factory operations, connected.</span
        ><span>Offline edition · v0.2</span>
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <section id="print-area" aria-label="Print document"></section>
  </body>
</html>
